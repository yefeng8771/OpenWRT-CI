# 自动同步上游 davidtall/DaeWRT-CI 到 main 并触发定制 re-cs-02 编译
#
# 设计：用 GitHub 官方 fork 同步接口（POST /repos/{owner}/{repo}/merge-upstream）
# 把上游变更同步进当前 fork 的 main，而不是 force-reset。这样我们的自定义文件（Patches/、Config/CUSTOM.txt、
# .github/workflows/QWRT.yml、.github/workflows/Auto-Sync-Upstream.yml、files/、docs/）
# 不会被擦除。
#
# 工作流：
#   1. 比较 ahead/behind
#   2. 若 behind == 0 直接退出
#   3. 调用 GitHub 官方 fork 同步接口 POST /repos/{owner}/{repo}/merge-upstream 同步 main
#      - 成功：上游变更合并进 main
#      - 409：冲突，开 issue，跳过本次
#   4. 关闭上游自带的自动触发工作流（避免跑非定制矩阵）
#   5. 触发 QWRT.yml（专用 re-cs-02 定制固件）
name: Auto-Sync-Upstream

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 03:00 上海
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM_OWNER: davidtall
  UPSTREAM_REPO: DaeWRT-CI
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Compare with upstream
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.AUTOSYNC_PAT != '' && secrets.AUTOSYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          INFO=$(gh api "repos/${{ github.repository }}/compare/${UPSTREAM_OWNER}:${UPSTREAM_BRANCH}...${{ github.repository_owner }}:main")
          AHEAD=$(echo "$INFO" | jq -r '.ahead_by')
          BEHIND=$(echo "$INFO" | jq -r '.behind_by')
          UPSTREAM_SHA=$(gh api "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" --jq '.sha')
          echo "ahead=$AHEAD"   >> $GITHUB_OUTPUT
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "Status: ahead=$AHEAD, behind=$BEHIND, upstream HEAD=$UPSTREAM_SHA"

      - name: Skip if up to date
        if: steps.cmp.outputs.behind == '0'
        run: echo "Already up to date with upstream"

      - name: Sync fork branch from upstream
        id: merge
        if: steps.cmp.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.AUTOSYNC_PAT != '' && secrets.AUTOSYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          RESPONSE=$(gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch="main" \
            2>&1)
          STATUS=$?
          set -e
          echo "$RESPONSE"
          if [ $STATUS -ne 0 ]; then
            if echo "$RESPONSE" | grep -Eqi '\b409\b|merge conflict'; then
              echo "result=conflict" >> $GITHUB_OUTPUT
            else
              echo "result=error" >> $GITHUB_OUTPUT
            fi
          else
            echo "result=success" >> $GITHUB_OUTPUT
            MERGE_TYPE=$(echo "$RESPONSE" | jq -r '.merge_type // empty')
            MERGE_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
            echo "merge_type=$MERGE_TYPE" >> $GITHUB_OUTPUT
            echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
            echo "Merge type: $MERGE_TYPE"
            echo "Main HEAD after sync: $MERGE_SHA"
          fi

      - name: Open issue on conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.AUTOSYNC_PAT != '' && secrets.AUTOSYNC_PAT || secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.cmp.outputs.upstream_sha }}
          AHEAD: ${{ steps.cmp.outputs.ahead }}
          BEHIND: ${{ steps.cmp.outputs.behind }}
        run: |
          cat > /tmp/issue.md <<'BODY'
          Auto-Sync 检测到与上游存在合并冲突，请本地解决：

          ```
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git
          git fetch upstream ${UPSTREAM_BRANCH}
          git checkout main
          git merge upstream/${UPSTREAM_BRANCH}
          # 解决冲突后
          git push origin main
          ```
          BODY
          # 用 envsubst 替换占位
          UPSTREAM_OWNER="$UPSTREAM_OWNER" UPSTREAM_REPO="$UPSTREAM_REPO" UPSTREAM_BRANCH="$UPSTREAM_BRANCH" \
            envsubst < /tmp/issue.md > /tmp/issue.final.md
          echo "" >> /tmp/issue.final.md
          echo "ahead=${AHEAD}, behind=${BEHIND}, upstream_sha=${UPSTREAM_SHA}" >> /tmp/issue.final.md
          title="Auto-Sync: merge conflict with upstream@${UPSTREAM_SHA}"
          if [ "$(gh api repos/${{ github.repository }} --jq '.has_issues')" != "true" ]; then
            echo "Repository issues are disabled; skip conflict issue creation"
          else
            existing=$(gh issue list --repo ${{ github.repository }} --state open --search "$title in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo ${{ github.repository }} --body-file /tmp/issue.final.md || true
            elif gh label list --repo ${{ github.repository }} --limit 200 2>/dev/null | awk '{print $1}' | grep -qx "auto-sync-conflict"; then
              gh issue create \
                --title "$title" \
                --body-file /tmp/issue.final.md \
                --label "auto-sync-conflict" || true
            else
              gh issue create \
                --title "$title" \
                --body-file /tmp/issue.final.md || true
            fi
          fi

      - name: Disable upstream's auto-trigger workflows
        if: steps.cmp.outputs.behind == '0' || steps.merge.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTOSYNC_PAT != '' && secrets.AUTOSYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 这些是上游自带、会在 Auto-Clean 完成时自动跑旧矩阵的工作流，
          # 我们只保留 QCA-6.18-VIKINGYFY 作为当前定制 re-cs-02 编译入口，旧 QCA-6.12 保持禁用（幂等）。
          for wf in QCA-6.12-VIKINGYFY.yml QCA-6.12-LiBwrt.yml WRT-CORE-TEST.yml; do
            gh workflow disable "$wf" --repo ${{ github.repository }} 2>/dev/null || true
          done

      - name: Trigger QCA-6.18 build
        if: steps.cmp.outputs.behind == '0' || steps.merge.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.AUTOSYNC_PAT != '' && secrets.AUTOSYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run QWRT.yml --repo ${{ github.repository }} -f TEST=false
          echo "QWRT build triggered"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Auto-Sync Summary"
            echo "- Upstream:    \`${UPSTREAM_OWNER}/${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`"
            echo "- Upstream SHA: ${{ steps.cmp.outputs.upstream_sha }}"
            echo "- ahead/behind: ${{ steps.cmp.outputs.ahead }} / ${{ steps.cmp.outputs.behind }}"
            echo "- Merge result: ${{ steps.merge.outputs.result }}"
            if [ -n "${{ steps.merge.outputs.merge_type }}" ]; then
              echo "- Merge type: ${{ steps.merge.outputs.merge_type }}"
            fi
            if [ -n "${{ steps.merge.outputs.merge_sha }}" ]; then
              echo "- Merge commit: ${{ steps.merge.outputs.merge_sha }}"
            fi
          } >> $GITHUB_STEP_SUMMARY
