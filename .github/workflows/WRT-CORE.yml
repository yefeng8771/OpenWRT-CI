#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      CI_NAME:
        required: false
        type: string
      WRT_ARCH:
        required: false
        type: string
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_DIR: "wrt"
  CI_NAME: ${{inputs.CI_NAME}}
  WRT_ARCH: ${{inputs.WRT_ARCH}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Projects
        uses: actions/checkout@v4
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install bc dos2unix python3-netifaces libfuse-dev
          dos2unix "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo bash "$GITHUB_WORKSPACE/Scripts/init_build_environment.sh"
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          if command -v go >/dev/null 2>&1; then
            echo "GO_INSTALLED=true" >> "$GITHUB_ENV"
          else
            echo "GO_INSTALLED=false" >> "$GITHUB_ENV"
          fi
      #          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
      #          sudo mkdir -p /mnt/build_wrt
      #          sudo chown $USER:$USER /mnt/build_wrt
      #          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Setup Go
        if: env.GO_INSTALLED != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go version

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

          [[ -z $WRT_ARCH ]] && {
            export WRT_ARCH=$(grep -m 1 -oP 'CONFIG_TARGET_DEVICE_[a-z0-9]+_\K[a-z0-9]+(?=_DEVICE)' $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt | head -n 1)
            echo "WRT_ARCH=$WRT_ARCH" >> $GITHUB_ENV
          }
          echo "$WRT_REPO/$WRT_BRANCH" > "$GITHUB_WORKSPACE/repo_flag"
      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir
          key: ${{ env.WRT_ARCH }}-${{ hashFiles('repo_flag', 'Config/**', 'Scripts/**', 'Patches/**', 'files/**', '.github/workflows/WRT-CORE.yml', '.github/workflows/QWRT.yml') }}
          restore-keys: |
            ${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-
            ${{ env.WRT_ARCH }}-

      - name: Refresh the cache
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          . $GITHUB_WORKSPACE/Scripts/function.sh
          cd ./wrt/

          generate_config && cat .config

          WRT_PACKAGE='' $GITHUB_WORKSPACE/Scripts/Settings.sh

          # WRT_PACKAGE 输入验证（过滤空行和非法格式）
          if [ -n "$WRT_PACKAGE" ]; then
            echo -e "$WRT_PACKAGE" | sed '/^[[:space:]]*$/d' | grep -E '^(CONFIG_[A-Z0-9_]+=.*|# CONFIG_[A-Z0-9_]+ is not set|#.*)$' >> ./.config || true
          fi

      - name: Apply Custom Patches
        run: |
          # 品牌定制
          bash $GITHUB_WORKSPACE/Patches/brand.sh
          # 设备选择
          bash $GITHUB_WORKSPACE/Patches/device-config.sh
          # 自定义包增删（在 wrt/package/ 目录下执行）
          cd ./wrt/package/
          bash $GITHUB_WORKSPACE/Patches/packages.sh
          cd $GITHUB_WORKSPACE
          # 细粒度补丁
          shopt -s nullglob
          for f in $GITHUB_WORKSPACE/Patches/patches.d/*.sh; do bash "$f"; done
          # 追加自定义配置覆盖
          cat $GITHUB_WORKSPACE/Config/CUSTOM.txt >> ./wrt/.config
          # defconfig 和 clean 在所有 patch 之后执行
          cd ./wrt/ && make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Inject Prebuilt Binaries
        run: |
          bash $GITHUB_WORKSPACE/Patches/inject-binaries.sh

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          echo "========cache status========"
          echo "ccache: $(du -sh ./wrt/.ccache 2>/dev/null | cut -f 1 || echo 0)"
          echo "staging: $(du -sh ./wrt/staging_dir 2>/dev/null | cut -f 1 || echo 0)"
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          join_or_none() {
            if [ -n "${1:-}" ]; then
              printf '%s\n' "$1"
            else
              printf '无\n'
            fi
          }

          extract_config_packages() {
            local mode="$1"
            local files=()
            for f in \
              "$GITHUB_WORKSPACE/Config/GENERAL.txt" \
              "$GITHUB_WORKSPACE/Config/CUSTOM.txt" \
              "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt"; do
              [ -f "$f" ] && files+=("$f")
            done
            [ "${#files[@]}" -gt 0 ] || return 0

            awk -v mode="$mode" '
              /^[[:space:]]*#/ && $0 !~ /^# CONFIG_PACKAGE_[A-Za-z0-9_+-]+ is not set/ { next }
              mode == "add" && /^CONFIG_PACKAGE_[A-Za-z0-9_+-]+=[ym]$/ {
                name=$1; sub(/^CONFIG_PACKAGE_/, "", name); sub(/=[ym]$/, "", name); print name
              }
              mode == "remove" && /^CONFIG_PACKAGE_[A-Za-z0-9_+-]+=n$/ {
                name=$1; sub(/^CONFIG_PACKAGE_/, "", name); sub(/=n$/, "", name); print name
              }
              mode == "remove" && /^# CONFIG_PACKAGE_[A-Za-z0-9_+-]+ is not set$/ {
                name=$2; sub(/^CONFIG_PACKAGE_/, "", name); print name
              }
            ' "${files[@]}"
          }

          extract_injected_packages() {
            local script="$GITHUB_WORKSPACE/Scripts/Packages.sh"
            [ -f "$script" ] || return 0

            awk '
              /^[[:space:]]*UPDATE_PACKAGE[[:space:]]+"/ {
                line=$0
                count=0
                while (match(line, /"[^"]+"/)) {
                  args[++count]=substr(line, RSTART + 1, RLENGTH - 2)
                  line=substr(line, RSTART + RLENGTH)
                }
                if (count < 2) { next }

                pkg=args[1]
                repo=args[2]
                repo_name=repo
                sub(/^.*\//, "", repo_name)
                if (repo_name ~ /^luci-(app|theme)-/) {
                  print repo_name
                } else {
                  print pkg
                }

                for (i=5; i<=count; i++) {
                  if (args[i] != "") { print args[i] }
                }
                delete args
              }
            ' "$script"
          }

          WRT_REMOVED_PACKAGES="$(extract_config_packages remove | sort -u | paste -sd ' ' -)"
          WRT_ADDED_PACKAGES="$( { extract_config_packages add; extract_injected_packages; } | sort -u | paste -sd ' ' -)"

          WRT_FEATURES_VALUE="$(cat <<'FEATURES'
- 基于 VIKINGYFY/immortalwrt main，上游源码与 QCA/NSS 硬件加速栈。
- 保留 WiFi 版无线栈；NOWIFI 配置会显式移除 ath11k/wpad/wifi-scripts 等无线组件。
- LuCI 主题使用 luci-theme-argon。
- 集成 EasyTier LuCI，并在补丁阶段跟随 EasyTier 最新 prerelease。
- 集成 Syncthing 与 luci-app-syncthing，Syncthing 源码固定同步 OpenWrt 24.10 并修正 Go include 路径。
- 注入 reF1nd sing-box prerelease 裸核到 /usr/bin/sing-box，附带 init.d、默认配置和 nftables TProxy 规则。
- 保留 Samba4、SQM、UPnP、TTYD、TinyFileManager、natmapt、cpufreq、autoreboot、package-manager 等常用管理功能。
- 移除 passwall/homeproxy/openclash/nikki/dae/daed/mosdns/tailscale/zerotier/dockerman 等重复或非目标方案。
FEATURES
          )"

          if [[ $WRT_TEST != 'true' ]]; then
            mapfile -t MANIFESTS < <(find ./bin/targets/ -type f -name "*.manifest" | sort)
            if [ "${#MANIFESTS[@]}" -gt 0 ]; then
              WRT_KVER_VALUE="$(awk '$1 == "kernel" && $2 == "-" { print $3 }' "${MANIFESTS[@]}" | sort -u | paste -sd ' ' -)"
              WRT_LIST_VALUE="$(awk '$1 ~ /^luci-(app|theme)/ { print $1 }' "${MANIFESTS[@]}" | sort -u | paste -sd ' ' -)"
              WRT_FINAL_PACKAGES_VALUE="$(awk 'NF { print $1 }' "${MANIFESTS[@]}" | sort -u | paste -sd ' ' -)"
            else
              WRT_KVER_VALUE="未找到 manifest"
              WRT_LIST_VALUE="未找到 manifest"
              WRT_FINAL_PACKAGES_VALUE="未找到 manifest"
            fi

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_DATE"."$EXT"
              mv -f "$FILE" ./upload/"$NEW_FILE"
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
          else
            WRT_KVER_VALUE="测试模式未编译，未生成固件 manifest"
            WRT_LIST_VALUE="测试模式未编译，未生成固件 manifest"
            WRT_FINAL_PACKAGES_VALUE="测试模式未编译，未生成固件 manifest"
          fi

          cat > ./release-body.md <<EOF
          这是个平台固件包，内含多个设备！
          请注意选择你需要的设备固件！
          不要问，刷就完事了！

          全系带开源硬件加速，别问了！

          源码：${WRT_REPO}
          分支：${WRT_BRANCH}
          提交：${WRT_HASH}

          配置：${WRT_CONFIG}
          平台：${WRT_TARGET}

          登录地址：${WRT_IP}
          登录密码：${WRT_PW}

          WIFI名称：${WRT_SSID}
          WIFI密码：${WRT_WORD}

          内核版本：${WRT_KVER_VALUE}
          特色与上游变更：
          ${WRT_FEATURES_VALUE}

          自定义/同步的包：$(join_or_none "$WRT_ADDED_PACKAGES")

          重点移除的包：$(join_or_none "$WRT_REMOVED_PACKAGES")

          完整包清单已随 Release 上传为 manifest 文件。
          EOF

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.CI_NAME}}-${{env.WRT_CONFIG}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body_path: ./wrt/release-body.md
